<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cafe &amp; Nova — Table Order</title>

  <!-- Google Fonts: Fraunces (display), Inter (body), IBM Plex Mono (ticket/data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/nova.css" />
</head>
<body>

  <!-- ===================== HEADER ===================== -->
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">&#9749;</span>
      <div class="brand-text">
        <h1 class="brand-name">Cafe &amp; Nova</h1>
        <p class="brand-tagline">order from your table</p>
      </div>
    </div>
    <div class="table-badge" id="tableBadge">
      <span class="table-badge-label">Table</span>
      <span class="table-badge-number" id="tableBadgeNumber">—</span>
    </div>
  </header>

  <!-- ===================== MAIN MENU ===================== -->
  <main class="app">
    <!-- Category filter tabs are generated by script.js -->
    <nav class="category-tabs" id="categoryTabs" aria-label="Menu categories"></nav>

    <!-- Menu items are rendered here by script.js -->
    <section class="menu-grid" id="menuGrid" aria-label="Menu items"></section>
  </main>

  <!-- Floating button that opens the cart drawer -->
  <button class="cart-fab" id="cartFab" aria-label="Open cart" type="button">
    <span class="cart-fab-icon" aria-hidden="true">&#128221;</span>
    <span class="cart-fab-text">View Order</span>
    <span class="cart-fab-count" id="cartCount">0</span>
  </button>

  <!-- Dimmed backdrop shown behind the open cart drawer -->
  <div class="drawer-overlay" id="drawerOverlay"></div>

  <!-- ===================== CART / ORDER TICKET DRAWER ===================== -->
  <aside class="cart-drawer" id="cartDrawer" aria-label="Your order">
    <div class="cart-drawer-inner">

      <div class="cart-header">
        <h2>Your Order</h2>
        <button class="cart-close" id="cartClose" aria-label="Close cart" type="button">&times;</button>
      </div>

      <!-- The "ticket" is the signature visual: a kitchen-order-style receipt -->
      <div class="ticket">
        <div class="ticket-items" id="ticketItems">
          <!-- Empty state or line items injected by script.js -->
        </div>

        <div class="ticket-perforation" aria-hidden="true"></div>

        <div class="ticket-total-row">
          <span class="ticket-total-label">Total</span>
          <span class="ticket-total-value" id="ticketTotal">₹0.00</span>
        </div>
      </div>

      <!-- Customer details + place order -->
      <form class="customer-form" id="customerForm" novalidate>
        <div class="field">
          <label for="customerName">Name</label>
          <input type="text" id="customerName" name="customer" placeholder="Your name" required />
        </div>

        <div class="field">
          <label for="customerPhone">Phone</label>
          <input type="tel" id="customerPhone" name="phone" placeholder="10-digit phone number" required />
        </div>

        <div class="field">
          <label for="customerTable">Table</label>
          <input type="text" id="customerTable" name="table" placeholder="Table number" required />
        </div>

        <div class="field">
          <label for="customerInstructions">Instructions <span class="field-optional">(optional)</span></label>
          <textarea id="customerInstructions" name="instructions" rows="2" placeholder="e.g. less spicy, no onions"></textarea>
        </div>

        <p class="form-error" id="formError" role="alert"></p>

        <button type="submit" class="place-order-btn" id="placeOrderBtn">
          Place Order &mdash; <span id="placeOrderTotal">₹0.00</span>
        </button>
      </form>

    </div>
  </aside>

  <!-- ===================== ORDER CONFIRMATION ===================== -->
  <div class="confirmation-screen" id="confirmationScreen" aria-live="polite">
    <div class="confirmation-ticket">
      <p class="confirmation-eyebrow">order confirmed</p>
      <div class="confirmation-stamp" id="confirmationStamp">#0000</div>
      <h2 class="confirmation-heading">Thanks, <span id="confirmationName">friend</span>!</h2>
      <p class="confirmation-sub">Your order is headed to the kitchen for table <strong id="confirmationTable">—</strong>.</p>

      <div class="confirmation-items" id="confirmationItems"></div>
      <div class="ticket-perforation" aria-hidden="true"></div>
      <div class="ticket-total-row">
        <span class="ticket-total-label">Total Paid at Counter</span>
        <span class="ticket-total-value" id="confirmationTotal">₹0.00</span>
      </div>

      <button class="new-order-btn" id="newOrderBtn" type="button">Start a New Order</button>
    </div>
  </div>

  <script src="js/cafenova.js"></script>
</body>
</html>
